openapi: 3.0.3
info:
  title: CashCraft API
  version: 1.1.0
servers:
  - url: http://localhost:8080
paths:
  /ping:
    get:
      responses:
        '200': {description: Service is ready}
  /api/auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '201': {description: User registered}
  /api/auth/login:
    post:
      summary: Get a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200': {description: JWT token}
  /api/transactions:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Transactions}
    post:
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Transaction created}
  /api/transactions/bulk:
    post:
      summary: Import transactions concurrently
      security: [{bearerAuth: []}]
      parameters:
        - name: workers
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 64, default: 4}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '#/components/schemas/TransactionInput'}
      responses:
        '200':
          description: Import summary, including rejected items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportSummary'}
        '400': {description: Invalid JSON or workers parameter}
        '504': {description: Import canceled or timed out}
  /api/budgets:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Budgets}
    post:
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Budget created or updated}
  /api/reports/summary:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Expense summary by category}
  /api/transactions/export.csv:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: CSV export}
  /api/transactions/import.csv:
    post:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Import summary}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8}
    TransactionInput:
      type: object
      required: [amount, category, date]
      properties:
        amount: {type: number, format: double}
        category: {type: string}
        description: {type: string}
        date: {type: string, format: date}
    ImportError:
      type: object
      required: [index, error]
      properties:
        index: {type: integer}
        error: {type: string}
    ImportSummary:
      type: object
      required: [accepted, rejected, errors]
      properties:
        accepted: {type: integer}
        rejected: {type: integer}
        errors:
          type: array
          items: {$ref: '#/components/schemas/ImportError'}
